name: Deploy Backend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10
          run_install: false

      - name: Deploy Backend for ${{ github.ref_name }}
        run: |
          export use_worker_assets=${{ secrets.USE_WORKER_ASSETS }}
          export use_worker_assets_with_telegram=${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}
          
          if [ -n "$use_worker_assets" ]; then
            cd frontend/
            pnpm install --no-frozen-lockfile
            if [ -n "$use_worker_assets_with_telegram" ]; then
              echo "Building with telegram pages"
              pnpm build:telegram:pages
            else
              echo "Building with normal pages"
              pnpm build:pages
            fi
            cd ..
          fi

          export debug_mode=${{ secrets.DEBUG_MODE }}
          export use_mail_wasm_parser=${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}
          
          cd worker/
          # ✅ 修复核心：使用环境变量写入，避免 Shell 解析特殊字符
          printf '%s\n' "$WRANGLER_TOML_CONTENT" > wrangler.toml

          # 临时修复：yiyang.uno 域名已从注册局删除（DNS NXDOMAIN、RDAP 404），
          # 保留它会令 wrangler 报 Could not find zone 导致部署失败。
          # 恢复该域名后请删除本段（路由与 DOMAINS/DEFAULT_DOMAINS 里的条目）。
          sed -i -E \
            -e '/pattern[[:space:]]*=[[:space:]]*"email\.yiyang\.uno"/d' \
            -e '/^[[:space:]]*"yiyang\.uno"[[:space:]]*,?[[:space:]]*$/d' \
            -e 's/[[:space:]]*,[[:space:]]*"yiyang\.uno"//g' \
            -e 's/"yiyang\.uno"[[:space:]]*,[[:space:]]*//g' \
            -e 's/[[:space:]]*,[[:space:]]*\]/ ]/g' \
            wrangler.toml
          if grep -q 'yiyang\.uno' wrangler.toml; then
            echo "::error::wrangler.toml 仍有 yiyang.uno 残留，拒绝部署"
            grep -n 'yiyang\.uno' wrangler.toml
            exit 1
          fi
          grep -q 'email\.0392yy\.cn' wrangler.toml || {
            echo "::error::wrangler.toml 缺少 email.0392yy.cn 路由，拒绝部署"
            exit 1
          }
          echo "wrangler.toml 已过滤 yiyang.uno 条目，保留 email.0392yy.cn"

          pnpm install --no-frozen-lockfile

          if [ -n "$use_mail_wasm_parser" ]; then
            echo "Using mail-parser-wasm-worker"
            pnpm add mail-parser-wasm-worker@0.2.3
            git apply ../.github/config/mail-parser-wasm-worker.patch
            echo "Applied mail-parser-wasm-worker patch"
          fi

          if [ "$debug_mode" = "true" ]; then
            pnpm run deploy
          else
              if pnpm run deploy; then
              echo "Deploy succeeded"
            else
              code=$?
              echo "Command failed with exit code $code"
              exit "$code"
            fi
          fi
          echo "Deployed for tag ${{ github.ref_name }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # ✅ 将 secret 映射到环境变量中
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}
